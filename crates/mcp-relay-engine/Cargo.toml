[package]
name = "mcp-relay-engine"
version = "0.1.0"
edition = "2021"
description = "Chunk-safe SSE framing and bounded replay buffer for MCP Relay Harness, compiled to WASM for use inside a Cloudflare Worker"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-bindgen = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[profile.release]
opt-level = "z"
lto = true
